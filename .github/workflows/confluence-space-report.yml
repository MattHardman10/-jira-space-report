name: Confluence Space Report

on:
  schedule:
    - cron: "15 20 * * 0"   # Monday ~6:15am Sydney (7:15am during daylight saving)
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - run: python confluence_space_report.py
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_SPACE_REPORT_PAGE_ID: ${{ secrets.CONFLUENCE_SPACE_REPORT_PAGE_ID }}
